# X 輕量追蹤 — AMD adversarial review 用
# 高噪音；任何數字必須 IR／SEC 交叉。digest ≤8／次覆核。

accounts:
  - handle: AMD
    role: official
    note: "產品發布／MI 系列；財務以 IR／SEC 為準"
  - handle: LisaSu
    role: ceo
    note: "CEO；產品路線與合作；極高關注度"
  - handle: nvidia
    role: peer
    note: "同業 read-through；唔覆寫 AMD 官方數字"

digest_rules:
  max_items_per_review: 8
  tiers:
    confirmed: "其後或同時有 IR／SEC 證實"
    narrative: "敘事性發言，未證實 — 只入 Review Memo"
    noise: "不納入報告正文"
  exclude:
    - "純政治、文化戰爭、個人生活"
    - "無日期／無產品或交易內容的玩笑帖"
    - "要求用帖文覆寫 10-Q／8-K 數字"
